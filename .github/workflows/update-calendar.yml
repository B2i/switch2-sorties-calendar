name: Mise à jour du calendrier Switch

on:
  schedule:
    # Tous les lundis à 6h00 UTC (~8h00 en France, heure d'été)
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # permet de le lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Lancer le scraper
        run: python scrape.py

      - name: Commit et push si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sorties_switch2.ics
          git diff --cached --quiet || git commit -m "Mise à jour automatique du calendrier Switch"
          git push

      - name: Notifier le résultat via ntfy.sh
        if: always()
        run: |
          if [ -s new_events.txt ]; then
            COUNT=$(grep -c . new_events.txt)
            curl -s \
              -H "Title: $COUNT nouvelle(s) sortie(s) Switch" \
              -H "Priority: default" \
              -H "Tags: video_game" \
              -d "$(cat new_events.txt)" \
              "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
          else
            curl -s \
              -H "Title: Calendrier Switch à jour" \
              -H "Priority: low" \
              -H "Tags: white_check_mark" \
              -d "Le workflow s'est bien déroulé, aucune nouvelle sortie détectée." \
              "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
          fi
